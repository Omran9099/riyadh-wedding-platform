services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: wedding-marketplace-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wedding-marketplace-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/wedding_marketplace
      JWT_SECRET: local-dev-only-change-before-any-deployment-use-long-random-string
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: wedding-marketplace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wedding_marketplace

volumes:
  mongodb_data:
